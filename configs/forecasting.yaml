# Parámetros del MVP de pronóstico (especificación §8). Se validan con Pydantic en
# src/forecasting/config.py. Los valores vienen del contrato predictivo; no se ajustan con datos.
# La sección `busqueda` es el pre-registro (especificación §7), aprobado por el responsable de la implementación el 2026-11-11.

datos:
  panel: data/processed/pilot_municipalities_weekly.parquet
  canal: data/processed/epidemiology/pilot_weekly_channel.parquet
  version_dvc_canal: 99fd12311a261264019645d906631cfc   # md5 del .dvc del canal (F1, especificación §4 «Canal: reparto y reutilización»)

canal:                             # contrato D1.1 y §1 (epiCo, method = "geometric")
  n: 5
  desplazamiento: 1
  cuantil_t: 0.025

horizonte:                         # contrato §3.5 (principal) y §3.6 (sensibilidad)
  h: 8                             # sobrescribible con FORECAST_HORIZON
  permitidos: [2, 4, 8, 12]

features:                          # contrato §5 y D6
  w: 4
  bloques:                         # semanas relativas a t, ambos extremos incluidos
    m1: [-3, 0]
    m2: [-7, -4]
    m3: [-11, -8]
  ventana_semanas: 12

validacion:                        # contrato D7 y §6.1
  desarrollo: [2019, 2022]
  prueba: [2023, 2025]
  primer_anio_entrenamiento: 2012

lineas_base:                       # contrato §4.1
  b1_semiventana: 2                # ventana circular de ±2 semanas del año de t + h

metricas:                          # contrato §10.16
  recorte_log_loss: 1.0e-15        # p se recorta a [ε, 1 − ε], el mismo para todos los sistemas

comparacion:                       # contrato D9, §8.2
  alfa: 0.05                       # umbral de azar < 5 % (binomial exacta y McNemar, una cola)

decision:                          # contrato D8, §7.4 y §7.5
  k: 2
  W: 12
  tau_grid: [0.05, 0.10, 0.15, 0.20, 0.25, 0.30, 0.35, 0.40, 0.45, 0.50,
             0.55, 0.60, 0.65, 0.70, 0.75, 0.80, 0.85, 0.90, 0.95]

seguimiento:                       # especificación §9
  modo: servidor                   # servidor | local; sin respaldo automático. Servidor desde el commit del pre-registro (especificación §7), antes de F5b
  uri_servidor: https://platform.arkoiot.com   # MLFLOW_TRACKING_URI tiene prioridad
  directorio_local: mlruns
  experimentos:
    desarrollo: dengue_h8_desarrollo
    prueba: dengue_h8_prueba
    final: dengue_h8_final

busqueda:                          # pre-registro (especificación §7; contrato §6.2–§6.3); responsable de la implementación, 2026-11-11
  logistica:                       # regresión logística L2: rejilla de C en escala log
    C: [0.01, 0.03, 0.1, 0.3, 1.0, 3.0]
    max_iter: 5000                 # la falta de convergencia es un error (models.py)
  lightgbm:                        # búsqueda aleatoria con presupuesto y semillas fijos
    n_candidatos: 25
    semilla_muestreo: 20261112     # numpy default_rng; parámetros sorteados en orden alfabético
    semilla_modelo: 20261112       # random_state igual en todos los candidatos y municipios
    fijos:
      subsample_freq: 1            # LightGBM 4.6.0: con subsample_freq <= 0 no hay submuestreo
    espacio:
      max_depth:         {escala: entera, rango: [2, 5]}
      num_leaves:        {escala: entera, rango: [4, 31], tope_por_profundidad: true}   # <= 2^max_depth
      learning_rate:     {escala: log,    rango: [0.01, 0.1]}
      n_estimators:      {escala: entera, rango: [100, 600]}
      min_child_samples: {escala: entera, rango: [10, 50]}
      reg_lambda:        {escala: real,   rango: [0.0, 10.0]}
      subsample:         {escala: real,   rango: [0.6, 1.0]}
      colsample_bytree:  {escala: real,   rango: [0.6, 1.0]}
