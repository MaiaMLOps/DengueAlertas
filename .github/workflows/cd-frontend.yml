name: CD Pipeline - Frontend Deployment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Entorno de despliegue en Cloudflare (staging / production)'
        required: true
        default: 'production'
        type: choice
        options:
          - staging
          - production
      run_id:
        description: 'ID de la ejecución de CI que generó el artefacto (opcional, si se deja vacío toma el último de la rama main)'
        required: false
        type: string

jobs:
  deploy-frontend:
    name: Deploy to Cloudflare Pages (${{ inputs.environment }})
    runs-on: ubuntu-latest
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
    
    steps:
      - name: Download Frontend Artifact
        uses: dawidd6/action-download-artifact@v2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: ci-frontend.yml
          run_id: ${{ inputs.run_id }}
          name: frontend-build
          path: ./frontend-deploy
          search_artifacts: true
          
      - name: Verify Artifact
        run: |
          ls -la ./frontend-deploy
          
      - name: Deploy to Cloudflare Pages using Wrangler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler@latest pages deploy ./frontend-deploy \
            --project-name="denguealertas" \
            --branch="${{ inputs.environment == 'production' && 'main' || inputs.environment }}"