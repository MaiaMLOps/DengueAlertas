[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dengue-alertas-ewt-final"
version = "1.0.0"
description = "Pipeline reproducible EWT: preparación, entrenamiento, validación, prueba y MLflow"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<3",
  "pandas>=2.0,<3",
  "scipy>=1.10,<2",
  "scikit-learn>=1.3,<2",
  "PyYAML>=6,<7",
  "joblib>=1.3,<2",
  "pyarrow>=14,<20",
  "lightgbm>=4,<5",
  "xgboost>=2,<4",
  "mlflow>=2.12,<3",
]

[project.scripts]
ewt-final = "ewt_final.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
